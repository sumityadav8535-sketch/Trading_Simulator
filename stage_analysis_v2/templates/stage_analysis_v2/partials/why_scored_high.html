{% if why_high %}
<div class="rounded-xl border border-emerald-200 bg-emerald-50/70 p-4 mt-4">
  <h4 class="text-sm font-semibold text-emerald-800 mb-2">Why this stock scored high</h4>
  <ul class="text-sm text-slate-700 space-y-1.5 list-disc list-inside">
    {% for reason in why_high %}
    <li>{{ reason }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
