<div class="card p-5 mt-4">
  <h4 class="text-sm font-semibold text-slate-800 mb-3">Transparent condition checklist</h4>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
    {% for c in conditions %}
    <div class="flex items-start gap-2 p-3 rounded-xl {% if c.met %}bg-emerald-50 border border-emerald-100{% else %}bg-slate-50 border border-slate-100{% endif %}">
      <span class="mt-0.5 font-bold {% if c.met %}text-emerald-600{% else %}text-slate-400{% endif %}">{% if c.met %}✓{% else %}○{% endif %}</span>
      <div>
        <p class="font-semibold {% if c.met %}text-emerald-800{% else %}text-slate-600{% endif %}">{{ c.name }}</p>
        <p class="text-slate-500">{{ c.detail }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
