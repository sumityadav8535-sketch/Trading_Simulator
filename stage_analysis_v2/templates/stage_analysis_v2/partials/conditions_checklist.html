<div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
  <h4 class="text-sm font-semibold text-slate-200 mb-3">Transparent Condition Checklist</h4>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
    {% for c in conditions %}
    <div class="flex items-start gap-2 p-2 rounded {% if c.met %}bg-emerald-950/30 border border-emerald-900/50{% else %}bg-slate-800/30 border border-slate-700/50{% endif %}">
      <span class="mt-0.5 {% if c.met %}text-emerald-400{% else %}text-slate-500{% endif %}">{% if c.met %}✓{% else %}○{% endif %}</span>
      <div>
        <p class="font-medium {% if c.met %}text-emerald-200{% else %}text-slate-400{% endif %}">{{ c.name }}</p>
        <p class="text-slate-500">{{ c.detail }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
