<div class="card p-5 mb-6 {% if market.favorable %}border-emerald-200 bg-emerald-50/50{% else %}border-amber-200 bg-amber-50/50{% endif %}">
  <div class="flex flex-wrap justify-between items-start gap-2">
    <div>
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Market context — Nifty 50</p>
      <p class="text-lg font-bold mt-1 text-slate-900">{{ market.stage_label }}</p>
      <p class="text-sm text-slate-600">{{ market.action }}</p>
    </div>
    <div class="text-right text-sm text-slate-700">
      <p>Nifty: <strong class="text-slate-900">{{ market.price|floatformat:2 }}</strong></p>
      <p class="text-blue-600 font-medium">30W MA: {{ market.ma_30w|floatformat:2 }}</p>
    </div>
  </div>
  {% if market.warning %}
  <p class="mt-3 text-sm font-medium {% if market.favorable %}text-amber-700{% else %}text-red-700{% endif %}">⚠ {{ market.warning }}</p>
  {% endif %}
</div>
