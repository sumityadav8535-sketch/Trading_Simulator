<div class="rounded-lg border p-4 mb-6 {% if market.favorable %}border-emerald-800 bg-emerald-950/30{% else %}border-amber-800 bg-amber-950/20{% endif %}">
  <div class="flex flex-wrap justify-between items-start gap-2">
    <div>
      <p class="text-xs text-slate-400 uppercase tracking-wide">Market Context — Nifty 50</p>
      <p class="text-lg font-bold mt-1">{{ market.stage_label }}</p>
      <p class="text-sm text-slate-400">{{ market.action }}</p>
    </div>
    <div class="text-right text-sm">
      <p>Nifty: <strong>{{ market.price|floatformat:2 }}</strong></p>
      <p class="text-blue-400">30W MA: {{ market.ma_30w|floatformat:2 }}</p>
    </div>
  </div>
  {% if market.warning %}
  <p class="mt-3 text-sm {% if market.favorable %}text-amber-300{% else %}text-red-300{% endif %}">⚠ {{ market.warning }}</p>
  {% endif %}
</div>
