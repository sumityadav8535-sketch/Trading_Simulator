{% if stage == 1 %}
<span class="badge badge-slate">S1 Base</span>
{% elif stage == 2 %}
<span class="badge badge-green">S2 Advancing</span>
{% elif stage == 3 %}
<span class="badge badge-amber">S3 Top</span>
{% elif stage == 4 %}
<span class="badge badge-red">S4 Decline</span>
{% else %}
<span class="badge badge-slate">—</span>
{% endif %}
