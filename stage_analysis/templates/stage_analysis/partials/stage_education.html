<section class="bg-slate-900 rounded-lg border border-slate-800 p-4">
  <h3 class="font-semibold mb-4 text-emerald-300">The 4 Stages (Stan Weinstein)</h3>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
    {% for s in stage_info %}
    <div class="border border-slate-800 rounded-lg p-3 {% if s.stage == 2 %}ring-1 ring-emerald-700{% endif %}">
      <div class="flex items-center gap-2 mb-2">
        {% include "stage_analysis/partials/stage_badge.html" with stage=s.stage %}
      </div>
      <p class="text-slate-400 text-xs mb-2">{{ s.description }}</p>
      <p class="text-xs text-slate-500"><strong class="text-slate-400">Action:</strong> {{ s.action }}</p>
    </div>
    {% endfor %}
  </div>
</section>
